    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 100px;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      ::-webkit-scrollbar {
        display: none;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #08121e;
        color: #f8fafc;
        overflow-x: hidden;
      }
      h1, h2, h3, .font-heading {
        font-family: 'Space Grotesk', sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Professional Contractor Estimate Print Styles */
      @media print {
        @page {
          size: letter portrait;
          margin: 10mm 12mm 12mm 12mm;
        }

        html, body {
          background-color: #ffffff !important;
          background-image: none !important;
          color: #0f172a !important;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
          font-size: 9.5pt !important;
          line-height: 1.4 !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* Hide all website navigation, hero, background noise, sidebars, and auxiliary sections */
        nav,
        footer,
        #division-portal,
        #hero,
        #services,
        #experience,
        #packages-heading,
        #packages-grid,
        .toast-container,
        .no-print,
        .print-hidden,
        button:not(.print-include),
        input,
        textarea,
        select {
          display: none !important;
          visibility: hidden !important;
        }

        /* Make estimate section full-width and unconstrained */
        #estimate {
          background: #ffffff !important;
          padding: 0 !important;
          margin: 0 !important;
          border: none !important;
        }

        #fence-estimate-engine {
          max-width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        /* Ensure print-only elements are visible */
        .print-only {
          display: block !important;
          visibility: visible !important;
        }

        /* Ensure crisp print borders & typography */
        .print-table {
          width: 100% !important;
          border-collapse: collapse !important;
          margin-top: 6px !important;
          margin-bottom: 10px !important;
        }

        .print-table th,
        .print-table td {
          border: 1px solid #cbd5e1 !important;
          padding: 5px 8px !important;
          text-align: left !important;
          font-size: 8.5pt !important;
          color: #1e293b !important;
        }

        .print-table th {
          background-color: #f1f5f9 !important;
          color: #0f2942 !important;
          font-weight: 700 !important;
        }

        .page-break-avoid {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }
      }
    </style>
